    <path d="M37 27.5 C 37 22, 41 20.5, 45 21.5 L 49.5 22.5 C 52 21.5, 54.5 22.5, 55 25 C 55.5 29, 51 31.5, 45.5 31.5 C 40.5 31.5, 37 30.5, 37 27.5 Z" fill="#ffd166"/>
